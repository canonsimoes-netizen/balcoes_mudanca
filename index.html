<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rollout Impressoras BPI — Mobile Friendly</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #0f1419;
  --surface: #1a2332;
  --surface2: #243044;
  --border: #2d3a4f;
  --text: #e8eef5;
  --muted: #8b9cb3;
  --accent: #3b82f6;
  --recolher: #ef4444;
  --mono: #f97316;
  --poli: #eab308;
  --manter: #22c55e;
  --sem: #64748b;
  --danger: #dc2626;
  --ok: #16a34a;
  --radius: 10px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.45;
  padding-bottom: calc(70px + var(--safe-bottom));
}

/* ========== HEADER ========== */
.header {
  background: linear-gradient(160deg, #1e3a5f 0%, #0f1419 100%);
  border-bottom: 1px solid var(--border);
  padding: 0.85rem 1rem 0.7rem;
  position: sticky; top: 0; z-index: 100;
}
.header-top {
  display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
}
.header h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
.header p { color: var(--muted); font-size: 0.72rem; margin-top: 0.1rem; }
.header-actions { display: flex; gap: 0.35rem; flex-shrink: 0; }

/* ========== BUTTONS ========== */
.btn {
  border: none; border-radius: 8px; padding: 0.45rem 0.75rem;
  font-size: 0.78rem; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; gap: 0.25rem;
  transition: all 0.15s; white-space: nowrap;
}
.btn-primary { background: var(--accent); color: white; }
.btn-primary:active { background: #2563eb; }
.btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-ghost:active { background: var(--border); }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.btn-ok { background: var(--ok); color: white; }
.btn-sm { padding: 0.3rem 0.55rem; font-size: 0.72rem; border-radius: 6px; }
.btn-icon { padding: 0.45rem; min-width: 38px; justify-content: center; }

/* ========== KPIs ========== */
.kpis {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.4rem;
  margin-top: 0.7rem;
}
.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.4rem 0.5rem;
  text-align: center;
}
.kpi .num { font-size: 1.1rem; font-weight: 700; line-height: 1.2; }
.kpi .label { font-size: 0.58rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.02em; }
.kpi.r .num { color: var(--recolher); }
.kpi.m .num { color: var(--mono); }
.kpi.p .num { color: var(--poli); }
.kpi.t .num { color: var(--manter); }
.kpi.s .num { color: var(--sem); }
.kpi.tot .num { color: var(--accent); }

/* ========== SEARCH ========== */
.search-row {
  padding: 0.6rem 1rem;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 90;
}
.search-box {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.55rem 0.85rem;
  color: var(--text);
  font-size: 0.9rem;
}
.search-box:focus { outline: none; border-color: var(--accent); }

/* ========== DISTRICT NAV (horizontal scroll) ========== */
.nav-dist {
  display: flex;
  gap: 0.35rem;
  padding: 0.55rem 1rem;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  position: sticky;
  z-index: 80;
}
.nav-dist::-webkit-scrollbar { display: none; }
.nav-dist a {
  flex-shrink: 0;
  color: var(--muted);
  text-decoration: none;
  font-size: 0.72rem;
  padding: 0.3rem 0.65rem;
  border-radius: 20px;
  background: var(--surface2);
  border: 1px solid transparent;
  transition: all 0.12s;
}
.nav-dist a:active, .nav-dist a.active {
  color: white;
  background: var(--accent);
  border-color: var(--accent);
}
.nav-dist a .cnt {
  background: rgba(0,0,0,0.25);
  padding: 0.05rem 0.3rem;
  border-radius: 8px;
  margin-left: 0.2rem;
  font-size: 0.65rem;
}

/* ========== CONTAINER ========== */
.container { padding: 0.8rem 0.85rem 1.5rem; }

/* ========== DISTRICT SECTION ========== */
.distrito {
  margin-bottom: 1.4rem;
  scroll-margin-top: 160px;
}
.distrito-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.55rem;
  flex-wrap: wrap;
}
.distrito-header h2 { font-size: 1.05rem; font-weight: 700; }
.badge {
  background: var(--accent); color: white;
  font-size: 0.7rem; font-weight: 600;
  padding: 0.12rem 0.45rem; border-radius: 12px;
}
.dstats { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-left: auto; }
.dstats span {
  font-size: 0.62rem; padding: 0.12rem 0.35rem;
  border-radius: 4px; font-weight: 600;
}
.s-r { background: rgba(239,68,68,0.2); color: #fca5a5; }
.s-m { background: rgba(249,115,22,0.2); color: #fdba74; }
.s-p { background: rgba(234,179,8,0.2); color: #fde047; }
.s-t { background: rgba(34,197,94,0.2); color: #86efac; }
.s-s { background: rgba(100,116,139,0.2); color: #94a3b8; }

/* ========== PRINTER CARDS (mobile-first) ========== */
.printer-list { display: flex; flex-direction: column; gap: 0.5rem; }
.printer-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.75rem 0.85rem;
  transition: border-color 0.15s;
}
.printer-card:active { border-color: var(--accent); }
.card-top {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem;
  margin-bottom: 0.45rem;
}
.card-serial {
  font-family: 'SF Mono', Consolas, monospace;
  font-weight: 700; font-size: 0.9rem;
  color: #93c5fd;
}
.card-modelo { font-size: 0.75rem; color: var(--muted); margin-top: 0.1rem; }
.pill {
  display: inline-block;
  padding: 0.15rem 0.5rem;
  border-radius: 5px;
  font-size: 0.68rem;
  font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
}
.a-recolher { background: var(--recolher); color: white; }
.a-mono { background: var(--mono); color: white; }
.a-poli { background: var(--poli); color: #1a1a1a; }
.a-manter { background: var(--manter); color: white; }
.a-sem { background: var(--sem); color: white; }

.card-body { font-size: 0.78rem; }
.card-row {
  display: flex; gap: 0.35rem;
  margin-top: 0.25rem;
  color: var(--muted);
}
.card-row strong { color: var(--text); font-weight: 500; min-width: 55px; }
.card-actions {
  display: flex; gap: 0.35rem; margin-top: 0.6rem; padding-top: 0.5rem;
  border-top: 1px solid var(--border);
}
.zona-tag {
  font-size: 0.65rem; color: var(--muted);
  background: var(--surface2); padding: 0.1rem 0.35rem; border-radius: 4px;
}

/* ========== DESKTOP TABLE (hidden on mobile) ========== */
.table-wrap { display: none; overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 0.8rem; background: var(--surface); min-width: 700px; }
thead { background: var(--surface2); }
th {
  text-align: left; padding: 0.5rem 0.65rem; font-weight: 600; color: var(--muted);
  font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.03em;
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
td { padding: 0.4rem 0.65rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:hover td { background: rgba(59,130,246,0.05); }
.serial {
  font-family: Consolas, monospace; font-weight: 600; font-size: 0.82rem;
  color: #93c5fd; cursor: pointer; text-decoration: underline; text-decoration-style: dotted;
}
.ops { display: flex; gap: 0.25rem; }

/* ========== BOTTOM BAR (mobile) ========== */
.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 0.55rem 1rem calc(0.55rem + var(--safe-bottom));
  display: flex; gap: 0.5rem; justify-content: space-around;
  z-index: 100;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
}
.bottom-bar .btn { flex: 1; justify-content: center; padding: 0.65rem 0.5rem; font-size: 0.8rem; }

/* ========== MODAL ========== */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.7); z-index: 200;
  align-items: flex-end; justify-content: center;
}
.overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px 16px 0 0;
  width: 100%; max-width: 520px;
  max-height: 92vh;
  overflow-y: auto;
  box-shadow: 0 -10px 40px rgba(0,0,0,0.4);
  animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { transform: translateY(40px); opacity: 0.6; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 1.1rem; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--surface); z-index: 5;
}
.modal-header h3 { font-size: 1rem; }
.modal-body { padding: 1rem 1.1rem; }
.modal-footer {
  display: flex; gap: 0.45rem; justify-content: flex-end; flex-wrap: wrap;
  padding: 0.85rem 1.1rem; border-top: 1px solid var(--border);
  position: sticky; bottom: 0; background: var(--surface);
}
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
.form-group { display: flex; flex-direction: column; gap: 0.2rem; }
.form-group.full { grid-column: 1 / -1; }
.form-group label {
  font-size: 0.68rem; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.03em; font-weight: 600;
}
.form-group input, .form-group select, .form-group textarea {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 0.55rem 0.7rem; color: var(--text); font-size: 0.9rem;
  font-family: inherit; width: 100%;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(59,130,246,0.25);
}
.form-group textarea { resize: vertical; min-height: 60px; }
.custom-fields-section { margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px dashed var(--border); }
.custom-fields-section h4 {
  font-size: 0.72rem; color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.04em; margin-bottom: 0.45rem; font-weight: 600;
}
.cf-row { display: flex; gap: 0.35rem; align-items: center; margin-bottom: 0.35rem; }
.cf-row input {
  background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
  padding: 0.4rem 0.55rem; color: var(--text); font-size: 0.85rem; font-family: inherit;
}
.cf-row .cf-key { flex: 0 0 110px; }
.cf-row .cf-val { flex: 1; }
.cf-row .cf-del {
  background: transparent; border: 1px solid var(--danger); color: var(--danger);
  border-radius: 5px; padding: 0.3rem 0.45rem; cursor: pointer; font-size: 0.7rem;
}
.btn-add-field {
  background: transparent; border: 1px dashed var(--border); color: var(--muted);
  border-radius: 7px; padding: 0.4rem 0.65rem; font-size: 0.75rem; cursor: pointer;
  width: 100%; margin-top: 0.25rem;
}

/* ========== TOAST ========== */
.toast {
  position: fixed; bottom: calc(80px + var(--safe-bottom)); left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ok); color: white;
  padding: 0.7rem 1.2rem; border-radius: 10px;
  font-size: 0.85rem; font-weight: 600; z-index: 300;
  opacity: 0; transition: all 0.25s; pointer-events: none;
  max-width: 90%; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { background: var(--danger); }

/* ========== EMPTY ========== */
.empty { text-align: center; padding: 2.5rem 1rem; color: var(--muted); font-size: 0.9rem; }

/* ========== DESKTOP MEDIA QUERY ========== */
@media (min-width: 768px) {
  body { padding-bottom: 0; }
  .header { padding: 1rem 1.5rem; }
  .header h1 { font-size: 1.3rem; }
  .kpis { grid-template-columns: repeat(6, 1fr); gap: 0.5rem; }
  .kpi { padding: 0.5rem 0.8rem; text-align: left; }
  .kpi .num { font-size: 1.25rem; }
  .search-row { padding: 0.7rem 1.5rem; }
  .search-box { max-width: 320px; }
  .nav-dist { padding: 0.55rem 1.5rem; }
  .container { padding: 1rem 1.5rem 2rem; max-width: 1400px; margin: 0 auto; }
  .printer-list { display: none; }
  .table-wrap { display: block; }
  .bottom-bar { display: none; }
  .overlay { align-items: center; }
  .modal {
    border-radius: 14px;
    max-height: 90vh;
    animation: none;
  }
  .form-grid { gap: 0.75rem; }
}

@media (min-width: 1100px) {
  .kpis { gap: 0.6rem; }
}
</style>
</head>

<div class="header">
  <div class="header-top">
    <div>
      <h1>🖨️ Rollout Impressoras BPI</h1>
      <p>Versão Mobile Friendly · Clica no serial para editar</p>

    </div>
  </div>
  <div class="kpis" id="kpis"></div>
</div>

<div class="search-row">

<div class="container" id="app"></div>

</div>

        <div class="form-group"><label>Modelo</label><input id="f_modelo"></div>
        <div class="form-group"><label>Ação</label>

        <div class="form-group full"><label>Morada</label><input id="f_morada"></div>
        <div class="form-group"><label>Cód. Postal</label><input id="f_cp"></div>
        <div class="form-group"><label>IP</label><input id="f_ip"></div>
        <div class="form-group"><label>Pessoa Contacto</label><input id="f_contacto"></div>
        <div class="form-group"><label>E-mail</label><input id="f_email"></div>
        <div class="form-group"><label>MAC</label><input id="f_mac"></div>
        <div class="form-group"><label>Zona</label>
          <select id="f_zona">
            <option value="">—</option>
            <option>Susana</option>
            <option>Fernando</option>
          </select>
        </div>
        <div class="form-group full"><label>Notas</label><textarea id="f_notas"></textarea></div>
      </div>
      <div class="custom-fields-section">
        <h4>Campos personalizados</h4>
        <div id="customFields"></div>
        <button type="button" class="btn-add-field" onclick="addCustomField()">＋ Adicionar campo</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="btnDelete" onclick="deleteCurrent()" style="margin-right:auto">🗑 Remover</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-ok" onclick="saveCurrent()">💾 Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

      (r.serial||'').toLowerCase().includes(q) ||
      (r.balcao||'').toLowerCase().includes(q) ||
      (r.morada||'').toLowerCase().includes(q) ||
      (r.contacto||'').toLowerCase().includes(q) ||
      (r.ip||'').toLowerCase().includes(q) ||
      (r.modelo||'').toLowerCase().includes(q) ||
      (r.distrito||'').toLowerCase().includes(q)
    );
  }

  // KPIs
  const tot = filtered.length;
  const counts = {'Recolher':0,'Subst. Mono':0,'Subst. Poli':0,'Manter Poli':0,'Sem ação':0};
  filtered.forEach(r => { if (counts[r.acao] !== undefined) counts[r.acao]++; });
  document.getElementById('kpis').innerHTML = `
    <div class="kpi tot"><div class="num">${tot}</div><div class="label">Total</div></div>
    <div class="kpi r"><div class="num">${counts['Recolher']}</div><div class="label">Recolher</div></div>
    <div class="kpi m"><div class="num">${counts['Subst. Mono']}</div><div class="label">Mono</div></div>
    <div class="kpi p"><div class="num">${counts['Subst. Poli']}</div><div class="label">Poli</div></div>
    <div class="kpi t"><div class="num">${counts['Manter Poli']}</div><div class="label">Manter</div></div>
    <div class="kpi s"><div class="num">${counts['Sem ação']}</div><div class="label">Sem ação</div></div>
  `;

  // Nav
  let nav = '';
  DISTRITO_ORDER.forEach(d => {
    const cnt = filtered.filter(r => r.distrito === d).length;
    if (!cnt) return;
    const slug = d.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'-');
    nav += `<a href="#${slug}">${d}<span class="cnt">${cnt}</span></a>`;
  });
  document.getElementById('nav').innerHTML = nav;

  // Content
  let html = '';
  DISTRITO_ORDER.forEach(d => {
    let rows = filtered.filter(r => r.distrito === d);
    if (!rows.length) return;
    rows.sort((a,b) => (acaoOrder[a.acao]??9) - (acaoOrder[b.acao]??9) || (a.cod||'').localeCompare(b.cod||'') || (a.serial||'').localeCompare(b.serial||''));
    const slug = d.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'-');
    const c = {'Recolher':0,'Subst. Mono':0,'Subst. Poli':0,'Manter Poli':0,'Sem ação':0};
    rows.forEach(r => { if (c[r.acao]!==undefined) c[r.acao]++; });
    let stats = '';
    if (c['Recolher']) stats += `<span class="s-r">${c['Recolher']} recolher</span>`;
    if (c['Subst. Mono']) stats += `<span class="s-m">${c['Subst. Mono']} mono</span>`;
    if (c['Subst. Poli']) stats += `<span class="s-p">${c['Subst. Poli']} poli</span>`;
    if (c['Manter Poli']) stats += `<span class="s-t">${c['Manter Poli']} manter</span>`;
    if (c['Sem ação']) stats += `<span class="s-s">${c['Sem ação']} sem</span>`;

    // Cards (mobile)
    let cards = '';
    rows.forEach(r => {
      const ac = acaoClass[r.acao] || 'a-sem';
      cards += `<div class="printer-card" onclick="openEdit('${escAttr(r.id)}')">
        <div class="card-top">
          <div>
            <div class="card-serial">${esc(r.serial)}</div>
            <div class="card-modelo">${esc(r.modelo)}</div>
          </div>
          <span class="pill ${ac}">${esc(r.acao)}</span>
        </div>
        <div class="card-body">
          <div class="card-row"><strong>Balcão</strong> ${esc(r.balcao||'—')}</div>
          <div class="card-row"><strong>Morada</strong> ${esc(r.morada||'—')}</div>
          <div class="card-row"><strong>IP</strong> ${esc(r.ip||'—')} ${r.zona ? `<span class="zona-tag">${esc(r.zona)}</span>` : ''}</div>
          ${r.contacto ? `<div class="card-row"><strong>Contacto</strong> ${esc(r.contacto)}</div>` : ''}
        </div>
        <div class="card-actions" onclick="event.stopPropagation()">
          <button class="btn btn-ghost btn-sm" onclick="openEdit('${escAttr(r.id)}')">✎ Editar</button>
          <button class="btn btn-danger btn-sm" onclick="quickDelete('${escAttr(r.id)}')">✕</button>
        </div>
      </div>`;
    });

    // Table (desktop)
    let tableRows = '';
    rows.forEach(r => {
      const ac = acaoClass[r.acao] || 'a-sem';
      const contactHtml = r.contacto
        ? `${esc(r.contacto)}${r.email ? `<div style="font-size:0.7rem;color:var(--muted)">${esc(r.email)}</div>` : ''}`
        : '—';
      tableRows += `<tr>
        <td><span class="pill ${ac}">${esc(r.acao)}</span></td>
        <td><span class="serial" onclick="openEdit('${escAttr(r.id)}')">${esc(r.serial)}</span></td>
        <td>${esc(r.modelo)}</td>
        <td>${esc(r.balcao||'')}</td>
        <td style="max-width:220px;font-size:0.75rem;color:var(--muted)">${esc(r.morada||'')}</td>
        <td style="font-family:monospace;font-size:0.75rem">${esc(r.ip||'—')}</td>
        <td>${contactHtml}</td>
        <td><span class="zona-tag">${esc(r.zona||'—')}</span></td>
        <td class="ops">
          <button class="btn btn-ghost btn-sm" onclick="openEdit('${escAttr(r.id)}')">✎</button>
          <button class="btn btn-danger btn-sm" onclick="quickDelete('${escAttr(r.id)}')">✕</button>
        </td>
      </tr>`;
    });

    html += `<div class="distrito" id="${slug}">
      <div class="distrito-header">
        <h2>${esc(d)}</h2>
        <span class="badge">${rows.length}</span>
        <div class="dstats">${stats}</div>
      </div>
      <div class="printer-list">${cards}</div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Ação</th><th>Serial</th><th>Modelo</th><th>Balcão</th><th>Morada</th>
            <th>IP</th><th>Contacto</th><th>Zona</th><th></th>
          </tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    </div>`;
  });

  document.getElementById('app').innerHTML = html || '<div class="empty">Nenhum resultado encontrado.</div>';
}

function openEdit(id) {
  isAdd = false; editId = id;
  const r = data.find(x => x.id === id);
  if (!r) return;
  document.getElementById('modalTitle').textContent = 'Editar — ' + r.serial;
  document.getElementById('btnDelete').style.display = '';
  fillForm(r);
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function openAdd() {
  isAdd = true; editId = null;
  document.getElementById('modalTitle').textContent = 'Adicionar impressora';
  document.getElementById('btnDelete').style.display = 'none';
  fillForm({serial:'',modelo:'',acao:'Sem ação',distrito:'Lisboa',cod:'',balcao:'',morada:'',cp:'',ip:'',contacto:'',email:'',zona:'',notas:'',mac:'',custom:{}});
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => document.getElementById('f_serial').focus(), 100);
}
function fillForm(r) {
  document.getElementById('f_serial').value = r.serial || '';
  document.getElementById('f_modelo').value = r.modelo || '';
  document.getElementById('f_acao').value = r.acao || 'Sem ação';
  document.getElementById('f_distrito').value = r.distrito || 'Outros';
  document.getElementById('f_cod').value = r.cod || '';
  document.getElementById('f_balcao').value = r.balcao || '';
  document.getElementById('f_morada').value = r.morada || '';
  document.getElementById('f_cp').value = r.cp || '';
  document.getElementById('f_ip').value = r.ip || '';
  document.getElementById('f_contacto').value = r.contacto || '';
  document.getElementById('f_email').value = r.email || '';
  document.getElementById('f_mac').value = r.mac || '';
  document.getElementById('f_zona').value = r.zona || '';
  document.getElementById('f_notas').value = r.notas || '';
  const cfBox = document.getElementById('customFields');
  cfBox.innerHTML = '';
  const customs = r.custom || {};
  Object.keys(customs).forEach(k => addCustomField(k, customs[k]));
}
function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}
function readForm() {
  const custom = {};
  document.querySelectorAll('#customFields .cf-row').forEach(row => {
    const k = row.querySelector('.cf-key').value.trim();
    const v = row.querySelector('.cf-val').value.trim();
    if (k) custom[k] = v;
  });
  return {
    serial: document.getElementById('f_serial').value.trim(),
    modelo: document.getElementById('f_modelo').value.trim(),
    acao: document.getElementById('f_acao').value,
    distrito: document.getElementById('f_distrito').value,
    cod: document.getElementById('f_cod').value.trim(),
    balcao: document.getElementById('f_balcao').value.trim(),
    morada: document.getElementById('f_morada').value.trim(),
    cp: document.getElementById('f_cp').value.trim(),
    ip: document.getElementById('f_ip').value.trim(),
    contacto: document.getElementById('f_contacto').value.trim(),
    email: document.getElementById('f_email').value.trim(),
    mac: document.getElementById('f_mac').value.trim(),
    zona: document.getElementById('f_zona').value,
    notas: document.getElementById('f_notas').value.trim(),
    custom: custom,
  };
}
function addCustomField(key, val) {
  const box = document.getElementById('customFields');
  const row = document.createElement('div');
  row.className = 'cf-row';
  const k = (key||'').replace(/"/g,'&quot;');
  const v = (val||'').replace(/"/g,'&quot;');
  row.innerHTML = `
    <input class="cf-key" placeholder="Nome" value="${k}">
    <input class="cf-val" placeholder="Valor" value="${v}">
    <button type="button" class="cf-del" onclick="this.parentElement.remove()">✕</button>
  `;
  box.appendChild(row);
}
function saveCurrent() {
  const f = readForm();
  if (!f.serial) { toast('Serial é obrigatório', true); return; }
  if (isAdd) {
    if (data.some(x => x.serial.toUpperCase() === f.serial.toUpperCase())) {
      toast('Já existe esse serial', true); return;
    }
    f.id = f.serial;
    data.push(f);
    toast('Impressora adicionada');
  } else {
    const idx = data.findIndex(x => x.id === editId);
    if (idx < 0) return;
    f.id = f.serial;
    data[idx] = f;
    toast('Alterações guardadas');
  }
  saveData(); closeModal(); render();
}
function deleteCurrent() {
  if (!editId) return;
  if (!confirm('Remover esta impressora?')) return;
  data = data.filter(x => x.id !== editId);
  saveData(); closeModal(); render(); toast('Removida');
}
function quickDelete(id) {
  if (!confirm('Remover esta impressora?')) return;
  data = data.filter(x => x.id !== id);
  saveData(); render(); toast('Removida');
}
function exportExcel() {
  if (typeof XLSX === 'undefined') {
    toast('Biblioteca Excel a carregar...', true); return;
  }
  const rows = data.map(r => ({
    'Serial': r.serial || '', 'Modelo': r.modelo || '', 'Ação': r.acao || '',
    'Distrito': r.distrito || '', 'Cód. Balcão': r.cod || '', 'Nome Balcão': r.balcao || '',
    'Morada': r.morada || '', 'Cód. Postal': r.cp || '', 'IP': r.ip || '',
    'Pessoa Contacto': r.contacto || '', 'E-mail': r.email || '', 'MAC': r.mac || '',
    'Zona': r.zona || '', 'Notas': r.notas || ''
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Impressoras');
  XLSX.writeFile(wb, 'BPI_Rollout_Impressoras.xlsx');
  toast('Excel exportado ✓');
}
function resetData() {
  if (!confirm('Repor dados originais? Perdes todas as alterações.')) return;
  localStorage.removeItem(STORAGE_KEY);
  loadData(); render(); toast('Dados repostos');
}
function initSelects() {
  const sel = document.getElementById('f_distrito');
  DISTRITO_ORDER.forEach(d => {
    const o = document.createElement('option');
    o.value = d; o.textContent = d;
    sel.appendChild(o);
  });
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay') closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

loadData();
initSelects();
render();
</script>
</body>
</html>
